services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: navi
      POSTGRES_PASSWORD: navi
      POSTGRES_DB: navi
    ports:
      - "5432:5432"
    volumes:
      - navi_postgres_data:/var/lib/postgresql/data

volumes:
  navi_postgres_data:
